# Publishes visualvm to https://xiondigital.net/visualvm/
#
# GitHub Pages serves this repo from main, so the app's build output is committed
# into visualvm/ here, the same shape as /arcade/ and /meldra/ (plain committed
# folders, no separate Pages project, no CNAME changes).
#
# Source of truth is XiONDiGiTaL/visualvm. Until that repo has a package.json the
# job falls back to the bootstrap copy, and logs a warning so it is not silent.
name: visualvm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/visualvm.yml"

permissions:
  contents: write

concurrency:
  group: visualvm-publish
  cancel-in-progress: false

jobs:
  # One-time: move the home page card onto classes that already exist in
  # xion.css, so it needs no stylesheet edit. Idempotent and guarded.
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Migrate the card
        run: |
          python3 - <<'PY'
          import pathlib
          page = pathlib.Path("index.html")
          src = page.read_text(encoding="utf-8")
          marker = "        <!-- App teaser: opens the standalone inbox -->"
          if marker not in src:
              print("card already migrated, nothing to do")
              raise SystemExit(0)
          if src.count(marker) != 1:
              raise SystemExit(f"marker count {src.count(marker)}, refusing to edit")
          start = src.index(marker)
          end = src.index("        </section>", start) + len("        </section>")
          CARD = '''
                  <!-- App card: opens the standalone inbox -->
                  <section class="section section--tight" aria-labelledby="visualvm-title">
                    <div class="wrap">
                      <div class="featured">
                        <a class="release-art spot" href="visualvm/" aria-label="Open visualvm">
                          <img
                            src="visualvm/icon-512.png"
                            width="512"
                            height="512"
                            alt="visualvm app icon: a blue waveform tile"
                            loading="lazy"
                            decoding="async"
                          />
                        </a>
                        <div class="featured__body">
                          <h3 id="visualvm-title">visualvm</h3>
                          <ul class="featured__meta">
                            <li>Android</li>
                            <li>Google Voice</li>
                            <li>On-device</li>
                          </ul>
                          <p class="featured__lede">
                            Reads Google Voice notifications into one searchable inbox and transcribes
                            each message on the phone. Audio never leaves the device.
                          </p>
                          <p class="featured__lede">
                            <a class="btn btn--ghost" href="visualvm/">
                              Open visualvm
                              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                                <path d="M7 17 17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round" />
                              </svg>
                            </a>
                          </p>
                        </div>
                      </div>
                    </div>
                  </section>
          '''
          out = src[:start] + CARD.strip("\n") + src[end:]
          if out.count("<section") != out.count("</section>"):
              raise SystemExit("unbalanced sections, refusing to edit")
          if "\u2014" in out:
              raise SystemExit("em dash still present, refusing to edit")
          if "featured__meta" not in out or "style=\"grid-template" in out:
              raise SystemExit("unexpected card markup, refusing to edit")
          page.write_text(out, encoding="utf-8")
          print("card migrated to the existing featured classes")
          PY

      - name: Commit the card
        run: |
          git config user.name "visualvm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no card change to commit"
            exit 0
          fi
          git commit -m "feat(site): rebuild the visualvm card on existing classes"
          git push

  publish:
    needs: card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the app source
        id: src
        run: |
          set -eu
          fallback_branch="freebuff/e8e295a9a759a07a6f3114f5"
          if curl -sfL https://raw.githubusercontent.com/XiONDiGiTaL/visualvm/main/package.json -o /dev/null; then
            git clone --depth 1 https://github.com/XiONDiGiTaL/visualvm.git .app
            echo "from=XiONDiGiTaL/visualvm@main" >> "$GITHUB_OUTPUT"
          elif curl -sfL "https://raw.githubusercontent.com/XiONDiGiTaL/MorphePatches/$fallback_branch/visualvm/package.json" -o /dev/null; then
            git clone --depth 1 -b "$fallback_branch" https://github.com/XiONDiGiTaL/MorphePatches.git .mono
            mv .mono/visualvm .app
            rm -rf .mono
            echo "::warning::XiONDiGiTaL/visualvm has no app source yet, publishing the bootstrap copy from MorphePatches@$fallback_branch. Push the source to XiONDiGiTaL/visualvm to switch over."
            echo "from=XiONDiGiTaL/MorphePatches@$fallback_branch/visualvm" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No app source found in XiONDiGiTaL/visualvm or the bootstrap branch."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .app/package-lock.json

      - name: Build with the /visualvm/ base
        working-directory: .app
        env:
          VITE_BASE: /visualvm/
        run: |
          npm ci
          npm run build

      - name: Mirror the build into visualvm/
        run: |
          mkdir -p visualvm
          find visualvm -mindepth 1 -delete
          cp -R .app/dist/. visualvm/
          rm -rf .app

      - name: Commit the build
        run: |
          git config user.name "visualvm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualvm
          if git diff --cached --quiet; then
            echo "visualvm/ already matches the source build"
            exit 0
          fi
          git commit -m "chore(visualvm): publish build to /visualvm/"
          git push
