# Publishes XiONDiGiTaL/visualvm to https://xiondigital.net/visualvm/
#
# GitHub Pages serves this repo from main, so the app's build output is committed
# into visualvm/ here - the same shape as /arcade/ and /meldra/ (plain committed
# folders, no separate Pages project, no CNAME changes).
name: visualvm

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/visualvm.yml"

permissions:
  contents: write

concurrency:
  group: visualvm-publish
  cancel-in-progress: false

jobs:
  # One-time: add the teaser card to the home page. Idempotent, so delete this
  # job (and `needs: card` on publish) once the card is live.
  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insert the teaser if it is missing
        run: |
          python3 - <<'PY'
          import pathlib
          page = pathlib.Path("index.html")
          src = page.read_text(encoding="utf-8")
          if "visualvm-title" in src:
              print("teaser already present, nothing to do")
              raise SystemExit(0)
          anchor = "\n        <!-- About -->\n"
          if src.count(anchor) != 1:
              raise SystemExit(f"anchor count {src.count(anchor)}, refusing to edit")
          if src.count("<section") != src.count("</section>"):
              raise SystemExit("unbalanced sections, refusing to edit")
          BLOCK = '''
                  <!-- App teaser: opens the standalone inbox -->
                  <section class="section section--tight" aria-labelledby="visualvm-title">
                    <div class="wrap teaser" style="grid-template-columns: minmax(0, 1fr)">
                      <div class="teaser__copy">
                        <p class="eyebrow">Apps / Android</p>
                        <h2 id="visualvm-title">Your voicemail, <em>transcribed.</em></h2>
                        <p>
                          visualvm reads Google Voice notifications into one searchable inbox and
                          transcribes each message on the device — audio never leaves the phone.
                        </p>
                        <a class="btn btn--ghost" href="visualvm/">
                          Open visualvm
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                            <path d="M7 17 17 7M9 7h8v8" stroke-linecap="round" stroke-linejoin="round" />
                          </svg>
                        </a>
                      </div>
                    </div>
                  </section>
          '''
          page.write_text(src.replace(anchor, BLOCK + anchor, 1), encoding="utf-8")
          print("inserted teaser")
          PY

      - name: Commit the card
        run: |
          git config user.name "visualvm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "no card change to commit"
            exit 0
          fi
          git commit -m "feat(site): link visualvm from the home page"
          git push

  publish:
    needs: card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the app repo has source
        id: src
        run: |
          if git ls-remote --exit-code https://github.com/XiONDiGiTaL/visualvm.git HEAD > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::XiONDiGiTaL/visualvm has no commits yet, nothing to publish."
          fi

      - name: Check out the app
        if: steps.src.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: XiONDiGiTaL/visualvm
          path: .app

      - name: Set up Node
        if: steps.src.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .app/package-lock.json

      - name: Build with the /visualvm/ base
        if: steps.src.outputs.found == 'true'
        working-directory: .app
        env:
          VITE_BASE: /visualvm/
        run: |
          npm ci
          npm run build

      - name: Mirror the build into visualvm/
        if: steps.src.outputs.found == 'true'
        run: |
          mkdir -p visualvm
          find visualvm -mindepth 1 -delete
          cp -R .app/dist/. visualvm/
          rm -rf .app

      - name: Commit the build
        if: steps.src.outputs.found == 'true'
        run: |
          git config user.name "visualvm"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visualvm
          if git diff --cached --quiet; then
            echo "visualvm/ already matches the source build"
            exit 0
          fi
          git commit -m "chore(visualvm): publish build to /visualvm/"
          git push
